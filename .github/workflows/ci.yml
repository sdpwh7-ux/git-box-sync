name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint (shellcheck)
        run: shellcheck -S warning sync.sh secret_scan.sh tests/test_sync.sh
      - name: Test
        run: bash tests/test_sync.sh
